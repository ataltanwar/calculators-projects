<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    
    <main>
    <h1>Interest Calculator</h1>
    
    <label>Principal Amount</label>
    <input type="number" id="amount" min="1000" placeholder="₹10,000">

    <div class="roi-box"> 
    <label>Rate of Interest (p.a)</label>
    <input type="number" id="rate" step="0.1" min="0" placeholder="5.6">
    <span class="rate-sign">%</span>
    </div>

    <label>Time (in years)</label>
    <input type="number" id="time" min="0" placeholder="10">

    <button id="calc-btn">Calculate</button>

    <div class="result">
    <p id="pa-output"></p>
    <p id="si-output"></p>
    <p id="ta-output"></p>
    </div>
   
    </main>


    <script>

        let amount = document.getElementById("amount")
        let rate= document.getElementById("rate")
        let time= document.getElementById("time")
        let button=document.getElementById("calc-btn")
        let siOutput=document.getElementById("si-output")
        let paOutput=document.getElementById("pa-output")
        let taOutput=document.getElementById("ta-output")
        let result;

        button.addEventListener("click", function(){
            let interest= (amount.value*rate.value*time.value)/100
            let result=interest;
            let paAmount=Number(amount.value)
            let totalAmount=(Number(amount.value)+Number(interest));
            paOutput.textContent= "Principal Amount- " +paAmount.toLocaleString("en-IN");
            siOutput.textContent = "Total Interest- " +result.toLocaleString("en-IN");
            taOutput.textContent="Total Amount- " +totalAmount.toLocaleString("en-IN");
        });


    </script>
    
</body>
</html>
