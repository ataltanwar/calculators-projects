<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    <main>
    
        <form>

            <h1>Calorie Calculator</h1>

        <div class="row-one">

            <div class="age">
            <label>Age</label>
            <input type="number" min="0" max="150" id="age" placeholder="24">
            </div>

            <div class="height">
            <label>Height</label>
            <input type="number" min="0" id="height" placeholder="176">
            </div>

            <div class="gender">
                    <label>Gender</label>
                    <div class="radio-btn">
                    <input type="radio" name="gender" value="male"  id="male" checked> <span>Male</span>
                    <input type="radio" name="gender" value="female" id="female"> <span>Female</span>
                    </div>
            </div>

        </div>

        <span class="yrs-sym">yrs</span>
        <span class="cm-sym">in cm</span>

        <div class="row-two">
            <div>
                <label>Weight</label>
                <input type="number" min="0" max="500" id="weight" placeholder="65">
            </div>

            <div class="activity">
                <label for="activity">Activity Level</label>
                <select name="level" id="activity">
                    <option value="" disabled selected>Select a level</option>
                    <option value="sedentary" title="Little to no exercise, desk job">Sedentary</option>
                    <option value="light" title="Light exercise or sports 1 to 3 days/week">Lightly active</option>
                    <option value="moderate" title="Moderate exercise or sports 3 to 5 days/week">Moderately active</option>
                    <option value="very" title="Hard exercise or sports 6 to 7 days/week">Very active</option>
                    <option value="super" title="Very hard exercise, physical job, or training twice a day">Super active</option>
                </select>
            </div>
        </div>

        <span class="kg-sym">in kgs</span>

        <div class="buttons">
        <button type="reset" id="reset" >Clear</button>
        <button id="submit">Calculate</button>
        </div>
        

        </form>

    </main>

    <div id="result">
        <p id="result-bmr"> </p>
        <p id="result-cal"> sw</p>
        </div>
    
    <script>

        let age= document.getElementById("age")
        let height=document.getElementById("height")
        let weight=document.getElementById("weight")
        let male=document.getElementById("male")
        let female=document.getElementById("female")
        let activity=document.getElementById("activity")
        let score;
        let button =document.getElementById("submit")
        let clear=document.getElementById("reset")
        let result=document.getElementById("result")
        let resultBmr=document.getElementById("result-bmr")
        let resultCal=document.getElementById("result-cal")

        button.addEventListener("click", function(){

            if(male.checked){
                
                let act=activity.value;
                let bmr= (Number(10*weight.value) + Number(6.25*height.value) - Number(5*age.value) ) + 5

                if(act==="sedentary"){
                score=bmr*1.2
                } else if(act==="light"){
                    score=bmr*1.375
                } else if(act==="moderate"){
                    score=bmr*1.55
                } else if(act==="very"){
                    score=bmr*1.725
                } else if(act==="super"){
                    score=bmr*1.9
                } else{
                    score=0
                }

                event.preventDefault();
                result.style.display='block';
                resultBmr.textContent="BMR (Basal Metabolic Rate)- " +bmr + " kcal/day" 
                resultCal.textContent="Daily Calorie (TDDE)- " +score.toFixed(0) + " kcal/day"
            } else if (female.checked){

                let act=activity.value;
                let bmr= (Number(10*weight.value) + Number(6.25*height.value) - Number(5*age.value) ) -161
                  
                if(act==="sedentary"){
                score=bmr*1.2
                } else if(act==="light"){
                    score=bmr*1.375
                } else if(act==="moderate"){
                    score=bmr*1.55
                } else if(act==="very"){
                    score=bmr*1.725
                } else if(act==="super"){
                    score=bmr*1.9
                } else{
                    score=0
                }
                
                event.preventDefault();
                result.style.display='block';
                resultBmr.textContent="BMR (Basal Metabolic Rate)- " +bmr + " kcal/day"
                resultCal.textContent="Daily Calorie (TDDE)- " +score.toFixed(1) + " kcal/day"
            } else{
                event.preventDefault();
                resultDiv.style.display='block';
                resultBmr.textContent="invalid fuck" 
                resultCal.textContent="invalid fuck" 
            }
                   
        })

    </script>


</body>
</html>
